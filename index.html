<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#060606"/>
  <title>Face Scan Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:#060606;overflow-x:hidden;overscroll-behavior:none}
    #app{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;position:relative;overflow:hidden;background:#060606;color:#eee;font-family:'DM Mono',monospace}
    .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,150,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,150,.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
    .screen{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
    .orb{font-family:'Orbitron',sans-serif;font-weight:900}
    input{width:100%;padding:14px 16px;background:#0c0c0c;border:1px solid #1c1c1c;border-radius:10px;color:#eee;font-family:'DM Mono',monospace;font-size:15px;outline:none;margin-bottom:10px}
    .btn{display:block;width:100%;padding:18px;border-radius:14px;font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:3px;cursor:pointer;margin-top:14px;border:2px solid;-webkit-appearance:none;text-align:center}
    .btn-green{border-color:#00ffb3;background:rgba(0,255,179,.08);color:#00ffb3}
    .btn-red{border-color:#ff4d00;background:rgba(255,77,0,.08);color:#ff4d00}
    .error{color:#ff4d00;font-size:12px;text-align:center;margin-top:12px;line-height:1.6}
    #scan-wrap{width:100%;position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;border:1.5px solid #111;flex:0 0 auto;max-width:400px}
    video{width:100%;height:100%;object-fit:cover;display:block}
    #scan-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .rating-overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spinner{width:44px;height:44px;border:3px solid #00ffb3;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
    .score-ring-wrap{display:flex;justify-content:center;margin-bottom:8px}
    .bar-row{margin-bottom:10px;width:100%}
    .bar-track{background:#111;border-radius:4px;height:5px;overflow:hidden}
    .bar-fill{height:100%;border-radius:4px;transition:width 1s ease}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes flicker{0%,95%,100%{opacity:1}96%,98%{opacity:.5}}
    .blink{animation:pulse .5s infinite}
    .pop{animation:pop .6s ease}
    .slide{animation:slideUp .5s ease}
    .flicker{animation:flicker 6s infinite}
    .hud{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .h2h-bars{display:flex;gap:4px;height:5px;margin-top:4px}
    .h2h-left{flex:1;background:#111;border-radius:4px 0 0 4px;overflow:hidden;display:flex;justify-content:flex-end}
    .h2h-right{flex:1;background:#111;border-radius:0 4px 4px 0;overflow:hidden}
    .avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;margin-bottom:16px;filter:saturate(.8)}
    .card{background:#0a0a0a;border-radius:12px;padding:16px;margin-bottom:20px;width:100%;text-align:left}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:20px}
    .result-card{background:#0a0a0a;border-radius:12px;padding:12px;text-align:center}
  </style>
</head>
<body>
<div class="grid-bg"></div>
<div id="app"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let state = {
  screen: 'home', // home|p1scan|p1done|handoff|p2scan|p2done|winner
  p1Name: '', p2Name: '',
  phase: 'idle', // idle|scanning|rating
  scanProgress: 0, timer: 20,
  p1Result: null, p2Result: null,
  p1Img: null, p2Img: null,
  cameraOn: false, error: ''
};
let stream = null, timerInt = null, scanInt = null;
let audioCtx = null, musicNodes = [];
const currentPlayer = () => state.screen.startsWith('p1') ? 1 : 2;

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screens = {
    home: renderHome, p1scan: renderScan, p2scan: renderScan,
    p1done: renderDone, handoff: renderHandoff,
    p2done: renderDone, winner: renderWinner
  };
  const fn = screens[state.screen];
  if (fn) fn(app);
  if (state.screen === 'p1scan' || state.screen === 'p2scan') initCamera();
}

// ── HOME ───────────────────────────────────────────────────────────────────
function renderHome(app) {
  app.style.justifyContent = 'center';
  app.innerHTML = `
    <div class="screen">
      <div style="text-align:center;margin-bottom:32px">
        <div class="orb flicker" style="font-size:9px;letter-spacing:6px;color:#00ffb3;opacity:.6;margin-bottom:8px;text-shadow:0 0 20px #00ffb350">◈ PASS THE PHONE ◈</div>
        <div class="orb" style="font-size:52px;line-height:.9;color:#fff;text-shadow:0 0 30px #fff3">FACE</div>
        <div class="orb" style="font-size:52px;line-height:.9;color:#ff4d00;text-shadow:0 0 30px #ff4d0060">SCAN</div>
        <div class="orb" style="font-size:52px;line-height:.9;color:#fff;text-shadow:0 0 30px #fff3;margin-bottom:8px">BATTLE</div>
        <div style="color:#222;font-size:10px;letter-spacing:3px">2 PLAYERS · 1 PHONE · AI JUDGE</div>
      </div>
      <input id="p1input" placeholder="Player 1 name..." value="${state.p1Name}"/>
      <input id="p2input" placeholder="Player 2 name..." value="${state.p2Name}"/>
      <button class="btn btn-green" id="startBtn">⚡ START BATTLE</button>
      ${state.error ? `<div class="error">${state.error}</div>` : ''}
    </div>`;
  document.getElementById('p1input').oninput = e => { state.p1Name = e.target.value; state.error = ''; };
  document.getElementById('p2input').oninput = e => { state.p2Name = e.target.value; state.error = ''; };
  document.getElementById('startBtn').onclick = () => {
    if (!state.p1Name.trim() || !state.p2Name.trim()) { state.error = 'Both players need a name!'; render(); return; }
    goToScan(1);
  };
}

// ── SCAN ───────────────────────────────────────────────────────────────────
function renderScan(app) {
  app.style.justifyContent = 'flex-start';
  app.style.paddingTop = '16px';
  const p = currentPlayer();
  const pName = p === 1 ? state.p1Name : state.p2Name;
  const timerCol = state.timer <= 5 ? '#ff4d00' : '#ffcc00';
  app.innerHTML = `
    <div class="hud">
      <div class="orb" style="font-size:11px;color:#00ffb3;text-shadow:0 0 20px #00ffb350">${pName.toUpperCase()}</div>
      <div class="orb ${state.timer<=5&&state.phase==='scanning'?'blink':''}" style="font-size:32px;color:${timerCol};text-shadow:0 0 20px ${timerCol}60">
        ${state.phase === 'scanning' ? state.timer + 's' : ''}
      </div>
      <div class="orb" style="font-size:11px;color:#333">PLAYER ${p}</div>
    </div>
    <div id="scan-wrap">
      <video id="vid" autoplay muted playsinline></video>
      <canvas id="scan-canvas" width="360" height="480"></canvas>
      ${state.phase === 'rating' ? `
        <div class="rating-overlay">
          <div class="spinner"></div>
          <div class="orb" style="font-size:10px;color:#00ffb3;letter-spacing:3px">AI RATING...</div>
        </div>` : ''}
    </div>
    <div style="width:100%;max-width:400px;margin-top:14px">
      ${state.error ? `<div class="error" style="margin-bottom:10px">${state.error}</div>` : ''}
      ${state.phase === 'idle' && !state.cameraOn ? `<div style="color:#333;font-size:12px;text-align:center;letter-spacing:1px">Loading camera...</div>` : ''}
      ${state.phase === 'idle' && state.cameraOn ? `<button class="btn btn-green" id="scanBtn">◈ SCAN MY FACE ◈</button>` : ''}
      ${state.phase === 'scanning' ? `<div style="color:#333;font-size:11px;text-align:center;letter-spacing:2px">HOLD STILL — SCANNING...</div>` : ''}
    </div>`;
  if (state.phase === 'idle' && state.cameraOn) document.getElementById('scanBtn').onclick = startScan;
  startDotAnimation();
}

// ── DONE ───────────────────────────────────────────────────────────────────
function renderDone(app) {
  app.style.justifyContent = 'flex-start';
  app.style.paddingTop = '32px';
  const p = currentPlayer();
  const result = p === 1 ? state.p1Result : state.p2Result;
  const img = p === 1 ? state.p1Img : state.p2Img;
  const name = p === 1 ? state.p1Name : state.p2Name;
  const nextName = p === 1 ? state.p2Name : '';
  const col = scoreCol(result.overall);
  app.innerHTML = `
    <div class="screen">
      <div class="orb" style="font-size:10px;letter-spacing:4px;color:${p===1?'#00ffb3':'#ff4d00'};margin-bottom:4px">SCAN COMPLETE</div>
      <div class="orb" style="font-size:26px;color:#fff;margin-bottom:12px">${name.toUpperCase()}</div>
      ${img ? `<img src="${img}" class="avatar" style="border:3px solid ${col}30"/>` : ''}
      <div class="score-ring-wrap">${scoreRingSVG(result.overall, 130)}</div>
      <div style="color:#555;font-size:12px;font-style:italic;margin-bottom:20px;text-align:center">"${result.verdict}"</div>
      <div class="card">
        ${barHTML('CHARISMA', result.charisma, 0)}
        ${barHTML('VIBE', result.vibe, 0.08)}
        ${barHTML('EXPRESSION', result.expression, 0.16)}
        ${barHTML('PHOTOGENIC', result.photogenic, 0.24)}
      </div>
      ${p === 1
        ? `<button class="btn btn-red" id="nextBtn">PASS TO ${nextName.toUpperCase()} →</button>`
        : `<button class="btn btn-red" id="nextBtn">🏆 SEE WHO WINS</button>`}
    </div>`;
  document.getElementById('nextBtn').onclick = p === 1 ? goToHandoff : goToWinner;
}

// ── HANDOFF ────────────────────────────────────────────────────────────────
function renderHandoff(app) {
  app.style.justifyContent = 'center';
  app.innerHTML = `
    <div class="screen" style="text-align:center">
      <div style="font-size:64px;margin-bottom:16px">📱</div>
      <div class="orb" style="font-size:22px;color:#ffcc00;margin-bottom:8px">HAND THE PHONE</div>
      <div class="orb" style="font-size:32px;color:#fff;margin-bottom:4px">TO ${state.p2Name.toUpperCase()}</div>
      <div style="color:#444;font-size:12px;letter-spacing:1px;margin-bottom:32px">${state.p1Name} scored ${state.p1Result?.overall}/100 — beat it!</div>
      <button class="btn btn-red" id="readyBtn">⚡ I'M READY — SCAN ME</button>
    </div>`;
  document.getElementById('readyBtn').onclick = () => goToScan(2);
}

// ── WINNER ─────────────────────────────────────────────────────────────────
function renderWinner(app) {
  app.style.justifyContent = 'flex-start';
  app.style.paddingTop = '32px';
  const p1s = state.p1Result.overall, p2s = state.p2Result.overall;
  const tied = p1s === p2s;
  const winnerName = tied ? null : (p1s > p2s ? state.p1Name : state.p2Name);
  const loserName = tied ? null : (p1s > p2s ? state.p2Name : state.p1Name);
  const diff = Math.abs(p1s - p2s);
  const winCol = tied ? '#ffcc00' : '#00ffb3';

  const h2hRows = ['charisma','vibe','expression','photogenic'].map((k,i) => {
    const s1 = state.p1Result[k]||0, s2 = state.p2Result[k]||0;
    const c1 = s1>=s2?'#00ffb3':'#333', c2 = s2>=s1?'#ff4d00':'#333';
    return `
      <div class="bar-row" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#444;margin-bottom:4px;font-family:monospace">
          <span style="color:${s1>=s2?'#00ffb3':'#555'}">${state.p1Name.slice(0,8)} ${s1}</span>
          <span style="color:#222;letter-spacing:2px">${k.toUpperCase()}</span>
          <span style="color:${s2>=s1?'#00ffb3':'#555'}">${s2} ${state.p2Name.slice(0,8)}</span>
        </div>
        <div class="h2h-bars">
          <div class="h2h-left"><div style="width:${s1}%;background:${c1};height:100%;transition:width 1s ease ${i*.1}s"></div></div>
          <div class="h2h-right"><div style="width:${s2}%;background:${c2};height:100%;transition:width 1s ease ${i*.1}s"></div></div>
        </div>
      </div>`;
  }).join('');

  const resultCard = (name, result, img, won) => `
    <div class="result-card" style="border:1px solid ${won&&!tied?'#00ffb330':'#111'}">
      ${img ? `<img src="${img}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid ${won&&!tied?'#00ffb340':'#1a1a1a'};filter:saturate(.75)"/>` : ''}
      <div class="orb" style="font-size:10px;color:${won&&!tied?'#00ffb3':'#555'};margin-bottom:4px">${name.toUpperCase()}</div>
      <div class="orb" style="font-size:36px;color:${won&&!tied?'#fff':'#444'};line-height:1">${result.overall}</div>
      <div style="color:#333;font-size:9px;margin-top:4px;line-height:1.5;font-style:italic">"${result.verdict}"</div>
    </div>`;

  app.innerHTML = `
    <div class="screen">
      <div style="font-size:56px;margin-bottom:4px;animation:pop .6s ease">${tied?'🤝':'🏆'}</div>
      <div class="orb" style="font-size:10px;letter-spacing:4px;color:${winCol};margin-bottom:4px">${tied?"IT'S A TIE":"WINNER"}</div>
      <div class="orb pop" style="font-size:34px;color:#fff;margin-bottom:2px">${winnerName||'NOBODY'}</div>
      ${!tied ? `<div style="color:#333;font-size:11px;letter-spacing:2px;margin-bottom:20px">beat ${loserName} by ${diff} points</div>`
               : `<div style="color:#555;font-size:11px;letter-spacing:2px;margin-bottom:20px">both scored ${p1s} — unbelievable</div>`}
      <div class="two-col">
        ${resultCard(state.p1Name, state.p1Result, state.p1Img, p1s>=p2s)}
        ${resultCard(state.p2Name, state.p2Result, state.p2Img, p2s>=p1s)}
      </div>
      <div class="card">
        <div class="orb" style="font-size:9px;letter-spacing:3px;color:#222;text-align:center;margin-bottom:12px">HEAD TO HEAD</div>
        ${h2hRows}
      </div>
      <button class="btn btn-green" id="againBtn">◈ PLAY AGAIN ◈</button>
    </div>`;
  document.getElementById('againBtn').onclick = resetGame;
}

// ── Camera ─────────────────────────────────────────────────────────────────
async function initCamera() {
  state.cameraOn = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:360},height:{ideal:480}},audio:false});
    const vid = document.getElementById('vid');
    if (vid) { vid.srcObject = stream; vid.onloadedmetadata = () => { state.cameraOn = true; render(); }; }
  } catch { state.error = 'Tap Allow when browser asks for camera access.'; render(); }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
  state.cameraOn = false;
}

// ── Scan sequence ──────────────────────────────────────────────────────────
async function startScan() {
  if (state.phase !== 'idle' || !state.cameraOn) return;
  state.phase = 'scanning'; state.scanProgress = 0; state.timer = 20; state.error = '';
  playBattleMusic();
  let t = 20;
  timerInt = setInterval(() => { t--; state.timer = t; updateHUD(); if(t<=0){clearInterval(timerInt);doCapture();} }, 1000);
  let p = 0;
  scanInt = setInterval(() => { p = Math.min(99, p+(100-p)*.024+.2); state.scanProgress = p; }, 150);
  render();
}

function updateHUD() {
  const el = document.querySelector('.hud .orb:nth-child(2)');
  if (el) { el.textContent = state.timer + 's'; el.style.color = state.timer<=5?'#ff4d00':'#ffcc00'; if(state.timer<=5) el.classList.add('blink'); }
}

async function doCapture() {
  clearInterval(scanInt); state.scanProgress = 100;
  stopMusic();
  state.phase = 'rating'; render();
  const vid = document.getElementById('vid');
  const b64 = captureFace(vid);
  const img = 'data:image/jpeg;base64,' + b64;
  if (currentPlayer()===1) state.p1Img = img; else state.p2Img = img;
  try {
    const result = await rateFace(b64);
    if (!result.faceDetected) { state.phase='idle'; state.scanProgress=0; state.error='No face detected! Look at camera and try again.'; render(); return; }
    if (currentPlayer()===1) state.p1Result=result; else state.p2Result=result;
    state.phase='idle'; state.screen = currentPlayer()===1?'p1done':'p2done'; render();
  } catch { state.phase='idle'; state.scanProgress=0; state.error='Rating failed — tap Scan to try again.'; render(); }
}

function captureFace(video) {
  const c = document.createElement('canvas'); c.width=360; c.height=480;
  const ctx = c.getContext('2d'); ctx.translate(360,0); ctx.scale(-1,1);
  ctx.drawImage(video,0,0,360,480);
  return c.toDataURL('image/jpeg',.82).split(',')[1];
}

// ── AI Rating ──────────────────────────────────────────────────────────────
async function rateFace(b64) {
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:600,
      messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
        {type:'text',text:`You're a fun hype face-rating judge for a phone game. Playful and dramatic, never mean. Respond ONLY raw JSON no markdown:\n{"overall":number 1-100,"charisma":number,"vibe":number,"expression":number,"photogenic":number,"verdict":"one fun sentence max 12 words","faceDetected":boolean}`}
      ]}]
    })
  });
  const d = await res.json();
  const txt = d.content?.find(b=>b.type==='text')?.text||'{}';
  try { return JSON.parse(txt.trim()); }
  catch { return {overall:50,charisma:50,vibe:50,expression:50,photogenic:50,verdict:'Unique specimen detected.',faceDetected:true}; }
}

// ── Navigation ─────────────────────────────────────────────────────────────
function goToScan(p) { state.phase='idle'; state.scanProgress=0; state.timer=20; state.error=''; state.screen=p===1?'p1scan':'p2scan'; render(); }
function goToHandoff() { stopCamera(); state.screen='handoff'; render(); }
async function goToWinner() { stopCamera(); playWinMusic(); state.screen='winner'; render(); }
function resetGame() {
  stopCamera(); stopMusic(); clearInterval(timerInt); clearInterval(scanInt);
  state = {screen:'home',p1Name:'',p2Name:'',phase:'idle',scanProgress:0,timer:20,p1Result:null,p2Result:null,p1Img:null,p2Img:null,cameraOn:false,error:''};
  render();
}

// ── Dot scan animation ──────────────────────────────────────────────────────
let dotAnim = null, dotData = [];
function startDotAnimation() {
  cancelAnimationFrame(dotAnim);
  const canvas = document.getElementById('scan-canvas'); if(!canvas)return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H*.46, rx=W*.33, ry=H*.38;
  if (!dotData.length) {
    for(let y=cy-ry;y<=cy+ry;y+=15) for(let x=cx-rx;x<=cx+rx;x+=15){const nx=(x-cx)/rx,ny=(y-cy)/ry;if(nx*nx+ny*ny<1)dotData.push({x,y,a:0,lm:false});}
    [[cx-rx*.28,cy-ry*.18],[cx+rx*.28,cy-ry*.18],[cx,cy+ry*.06],[cx-rx*.17,cy+ry*.32],[cx+rx*.17,cy+ry*.32],[cx,cy+ry*.42]].forEach(([x,y])=>dotData.push({x,y,a:0,lm:true}));
  }
  let frame=0;
  const draw = () => {
    frame++;
    ctx.clearRect(0,0,W,H);
    const scanning = state.phase==='scanning';
    if(!scanning){
      dotData.forEach(d=>{d.a=Math.max(0,Math.min(.2,d.a+(Math.random()>.6?.008:-.004)));ctx.beginPath();ctx.arc(d.x,d.y,1.3,0,Math.PI*2);ctx.fillStyle=`rgba(0,230,170,${d.a})`;ctx.fill();});
    } else {
      const prog = state.scanProgress;
      const scanY = (cy-ry)+(prog/100)*(ry*2);
      const g=ctx.createLinearGradient(0,scanY-30,0,scanY+4);g.addColorStop(0,'rgba(0,255,180,0)');g.addColorStop(.7,'rgba(0,255,180,.08)');g.addColorStop(1,'rgba(0,255,180,.6)');
      ctx.fillStyle=g;ctx.fillRect(0,scanY-30,W,34);
      ctx.beginPath();ctx.moveTo(0,scanY);ctx.lineTo(W,scanY);ctx.strokeStyle='rgba(0,255,180,.95)';ctx.lineWidth=1.8;ctx.stroke();
      dotData.forEach(d=>{
        const sc=d.y<=scanY; d.a+=((sc?1:0)-d.a)*.12;
        const nr=Math.abs(d.y-scanY)<22,gl=nr?.5+.5*Math.sin(frame*.5):0,a=Math.min(1,d.a+gl),r=d.lm?3.5:(sc?2:1.3);
        ctx.beginPath();ctx.arc(d.x,d.y,r,0,Math.PI*2);ctx.fillStyle=d.lm?`rgba(80,255,160,${a})`:`rgba(0,210,180,${a})`;ctx.fill();
        if(d.lm&&a>.4){ctx.beginPath();ctx.arc(d.x,d.y,7,0,Math.PI*2);ctx.fillStyle=`rgba(0,255,150,${a*.22})`;ctx.fill();}
      });
      const lit=dotData.filter(x=>x.lm&&x.a>.35);
      if(lit.length>1){ctx.strokeStyle='rgba(0,255,180,.1)';ctx.lineWidth=.7;for(let i=0;i<lit.length-1;i++){ctx.beginPath();ctx.moveTo(lit[i].x,lit[i].y);ctx.lineTo(lit[i+1].x,lit[i+1].y);ctx.stroke();}}
      const bs=32;ctx.strokeStyle='rgba(0,255,180,.8)';ctx.lineWidth=2.5;
      [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(([x,y,dx,dy])=>{ctx.beginPath();ctx.moveTo(x+dx*bs,y);ctx.lineTo(x,y);ctx.lineTo(x,y+dy*bs);ctx.stroke();});
      ctx.font='bold 10px monospace';ctx.fillStyle='rgba(0,255,180,.85)';ctx.fillText(`SCANNING ${Math.round(prog)}%`,12,18);
    }
    if(document.getElementById('scan-canvas')) dotAnim=requestAnimationFrame(draw);
  };
  draw();
}

// ── Music (Web Audio API — no external library needed) ─────────────────────
function getAudioCtx() { if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function playBattleMusic() {
  stopMusic();
  try {
    const ctx = getAudioCtx(); if(ctx.state==='suspended') ctx.resume();
    const bpm=145, beat=60/bpm;
    // Simple repeating kick+arp pattern
    const playKick = (t) => {
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(0.01,t+.3);
      g.gain.setValueAtTime(.8,t); g.gain.exponentialRampToValueAtTime(.01,t+.3);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.3);
    };
    const playSnare = (t) => {
      const buf=ctx.createBuffer(1,ctx.sampleRate*.15,ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.5;
      const s=ctx.createBufferSource(),g=ctx.createGain();
      g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.01,t+.15);
      s.buffer=buf; s.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t+.15);
    };
    const notes=[261,311,392,466,523,466,392,349];
    const playArp = (t,i) => {
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sawtooth'; o.frequency.value=notes[i%notes.length];
      g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+beat*.4);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+beat*.4);
    };
    let now=ctx.currentTime+.05, step=0;
    const schedule = () => {
      while(now < ctx.currentTime+.5) {
        if(step%4===0) playKick(now);
        if(step%4===2) playSnare(now);
        playArp(now,step);
        now+=beat/2; step++;
      }
    };
    const intv=setInterval(schedule,200);
    musicNodes=[{stop:()=>clearInterval(intv)}];
  } catch {}
}

function playWinMusic() {
  stopMusic();
  try {
    const ctx=getAudioCtx(); if(ctx.state==='suspended') ctx.resume();
    const fanfare=[[261,.1],[329,.2],[392,.3],[523,.5],[659,.8]];
    fanfare.forEach(([freq,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='triangle'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,ctx.currentTime+t); g.gain.linearRampToValueAtTime(.2,ctx.currentTime+t+.05);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.6);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.7);
    });
  } catch {}
}

function stopMusic() { musicNodes.forEach(n=>{try{n.stop();}catch{}}); musicNodes=[]; }

// ── Helpers ────────────────────────────────────────────────────────────────
function scoreCol(s) { return s>=75?'#00ffb3':s>=50?'#ffcc00':'#ff4d00'; }

function scoreRingSVG(score, size) {
  const r=size/2-8, circ=2*Math.PI*r, col=scoreCol(score);
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#111" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="7"
      stroke-dasharray="${(score/100)*circ} ${circ}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray 1.2s ease"/>
    <text x="${size/2}" y="${size/2+2}" text-anchor="middle" dominant-baseline="middle"
      style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:${size*.22}px;fill:${col}">${score}</text>
  </svg>`;
}

function barHTML(label, score, delay) {
  const col=scoreCol(score);
  return `<div class="bar-row">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:3px;font-family:monospace">
      <span style="color:#888">${label}</span><span style="color:${col}">${score}</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" style="width:${score}%;background:linear-gradient(90deg,#ff4d00,${col});transition-delay:${delay}s"></div>
    </div>
  </div>`;
}

render();
